# Validate annotation repository inputs (no writes).
#
# This checks that:
# - `annotations/config.json` has the expected structure/version
# - each per-user file under `annotations/users/*.json` is well-formed and
#   consistent (e.g. username matches `githubUserId`)
# - optional author-only merges file (if present) is valid
#
# The goal is to fail fast on malformed JSON or schema violations before they
# reach the Cellucid UI (or other tooling consuming this repo).
name: Validate Annotation Files

on:
  push:
    paths:
      - ".github/workflows/validate.yml"
      - "annotations/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/validate.yml"
      - "annotations/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test exact annotation contracts
        run: python -m unittest discover -s tests -v
      - name: Validate repository inputs
        run: python scripts/validate_user_files.py
